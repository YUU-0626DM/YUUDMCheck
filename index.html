<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デュエマ所持カード管理</title>

<style>
body{
    font-family:sans-serif;
    background:#0f172a;
    color:white;
    margin:0;
    padding:20px;
}

.container{
    max-width:1000px;
    margin:auto;
}

.card{
    background:#1e293b;
    padding:15px;
    border-radius:10px;
    margin-bottom:10px;
}

button{
    cursor:pointer;
    border:none;
    border-radius:6px;
    padding:8px 12px;
    margin-right:5px;
}

.add{
    background:#4f46e5;
    color:white;
}

.plus{
    background:#16a34a;
    color:white;
}

.minus{
    background:#dc2626;
    color:white;
}

.save{
    background:#2563eb;
    color:white;
}

input{
    padding:8px;
    border-radius:6px;
}

#cardList{
    margin-top:20px;
}
</style>

</head>
<body>

<div class="container">

<h1>デュエマ所持カード管理</h1>

<input
id="searchBox"
type="text"
placeholder="カード名検索"
oninput="renderCards()"
>

<select
id="civilizationFilter"
onchange="renderCards()"
>

<option value="">全文明</option>

<option value="火">火</option>
<option value="水">水</option>
<option value="自然">自然</option>
<option value="光">光</option>
<option value="闇">闇</option>
<option value="ゼロ">ゼロ</option>

</select>

<input
id="costFilter"
type="number"
placeholder="最大コスト"
oninput="renderCards()"
>

<input
id="raceFilter"
type="text"
placeholder="種族"
oninput="renderCards()"
>
  

<button
class="add"
onclick="addCard()"
>
カード追加
</button>

<button
class="save"
onclick="exportJSON()"
>
JSON保存
</button>

<button
onclick="analyzeDeck()"
style="background:#16a34a;color:white;"
>
デッキ不足抽出
</button>    
<label style="cursor:pointer;">
JSON読込
<input
type="file"
hidden
onchange="importJSON(event)"
>
</label>

<div id="cardList"></div>

</div>

<script>

let cards=[];

function loadData(){

const saved=
localStorage.getItem("duema_cards");

if(saved){

cards=
JSON.parse(saved);

}else{

cards=[

{
id:1,
name:"フェアリー・ライフ",
qty:0
},

{
id:2,
name:"天災 デドダム",
qty:0
},

{
id:3,
name:"飛翔龍5000VT",
qty:0
}

];

}

}

function saveData(){

localStorage.setItem(
"duema_cards",
JSON.stringify(cards)
);

}

function addCard(){

const name=
prompt("カード名");

if(!name)return;

cards.push({

id:Date.now(),
name:name,
qty:0,
cost:0,
civilization:"",
race:"",
rarity:""

});

saveData();

renderCards();

}

function changeQty(id,amount){

const card=
cards.find(
c=>c.id===id
);

if(!card)return;

card.qty=
Math.max(
0,
card.qty+amount
);

saveData();

renderCards();

}

function deleteCard(id){

if(
!confirm("削除しますか？")
)return;

cards=
cards.filter(
c=>c.id!==id
);

saveData();

renderCards();

}

function renderCards(){

const keyword=
document
.getElementById("searchBox")
.value
.toLowerCase();

const civ =
document
.getElementById(
"civilizationFilter"
).value;

const cost =
document
.getElementById(
"costFilter"
).value;

const race =
document
.getElementById(
"raceFilter"
).value
.toLowerCase();

const filtered =
cards.filter(card=>{

if(
!card.name
.toLowerCase()
.includes(keyword)
){
return false;
}

if(
civ &&
card.civilization !== civ
){
return false;
}

if(
cost &&
card.cost > Number(cost)
){
return false;
}

if(
race &&
!(
card.race || ""
)
.toLowerCase()
.includes(race)
){
return false;
}

return true;

});

document
.getElementById("cardList")
.innerHTML=

filtered.map(card=>`

<div class="card">

<h3>${card.name}</h3>

<p>
文明:
${card.civilization || "-"}
</p>

<p>
コスト:
${card.cost || 0}
</p>

<p>
種族:
${card.race || "-"}
</p>

<p>
所持枚数:
${card.qty}
</p>

<button
class="minus"
onclick="changeQty(${card.id},-1)"
>
－
</button>

<button
class="plus"
onclick="changeQty(${card.id},1)"
>
＋
</button>

<button
onclick="editCard(${card.id})"
>
編集
</button>
<button
onclick="deleteCard(${card.id})"
>
削除
</button>

</div>

`).join("");

}

function exportJSON(){

const json=
JSON.stringify(
cards,
null,
2
);

const blob=
new Blob(
[json],
{
type:"application/json"
}
);

const url=
URL.createObjectURL(blob);

const a=
document.createElement("a");

a.href=url;

a.download=
"duema_cards_backup.json";

a.click();

URL.revokeObjectURL(url);

}

function importJSON(event){

const file=
event.target.files[0];

if(!file)return;

const reader=
new FileReader();

reader.onload=function(e){

try{

cards=
JSON.parse(
e.target.result
);

saveData();

renderCards();

alert(
"復元完了"
);

}catch{

alert(
"JSON読込失敗"
);

}

};

reader.readAsText(file);

}

function analyzeDeck(){

const input=
prompt(
`デッキリストを貼り付け

例

4 フェアリー・ライフ
4 天災 デドダム
2 飛翔龍5000VT`
);

if(!input) return;

const lines=
input.split("\n");

let result=[];

lines.forEach(line=>{

line=line.trim();

if(!line) return;

const match=
line.match(/^(\d+)\s+(.+)$/);

if(!match) return;

const need=
parseInt(match[1]);

const name=
match[2].trim();

const ownedCard=
cards.find(
c=>
c.name.toLowerCase()
===
name.toLowerCase()
);

const owned=
ownedCard
? ownedCard.qty
: 0;

const shortage=
Math.max(
0,
need-owned
);

if(shortage>0){

result.push(
`${name}
必要:${need}
所持:${owned}
不足:${shortage}`
);

}

});

if(result.length===0){

alert(
"不足カードはありません"
);

return;

}

alert(
result.join("\n\n")
);

}

loadData();

renderCards();

</script>

</body>
</html>
