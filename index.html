<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
デュエマ所持カード管理ツール
</title>

<style>

body{

background:#0f172a;
color:white;

font-family:sans-serif;

margin:0;
padding:20px;

}

.container{

max-width:1200px;
margin:auto;

}

h1{

margin-bottom:20px;

}

.toolbar{

display:flex;
flex-wrap:wrap;
gap:10px;

margin-bottom:20px;

}

button{

padding:8px 12px;

border:none;

border-radius:6px;

cursor:pointer;

}

input,select{

padding:8px;

border-radius:6px;

border:none;

}

.card{

background:#1e293b;

padding:15px;

border-radius:10px;

margin-bottom:10px;

}

.card-grid{

display:grid;

grid-template-columns:
repeat(auto-fill,minmax(280px,1fr));

gap:10px;

}

.add-btn{

background:#4f46e5;
color:white;

}

.json-btn{

background:#2563eb;
color:white;

}

.deck-btn{

background:#16a34a;
color:white;

}

.edit-btn{

background:#f59e0b;
color:black;

}

.delete-btn{

background:#dc2626;
color:white;

}

.plus-btn{

background:#22c55e;
color:white;

}

.minus-btn{

background:#ef4444;
color:white;

}
.card-info{

font-size:14px;

line-height:1.5;

}

.ruby{

font-size:10px;

color:#94a3b8;

display:block;

margin-top:-4px;

margin-bottom:4px;

}

</style>

</head>

<body>

<div class="container">

<h1>
デュエマ所持カード管理ツール
</h1>

<div class="toolbar">

<input
id="searchBox"
type="text"
placeholder="カード名・ルビ検索"
oninput="renderCards()"
>

<select
id="civilizationFilter"
onchange="renderCards()"
>

<option value="">
全文明
</option>

<option value="火">火</option>
<option value="水">水</option>
<option value="自然">自然</option>
<option value="光">光</option>
<option value="闇">闇</option>
<option value="ゼロ">ゼロ</option>

</select>

<input
id="costFilter"
type="number"
placeholder="最大コスト"
oninput="renderCards()"
>

<input
id="raceFilter"
type="text"
placeholder="種族"
oninput="renderCards()"
>

<input
id="rarityFilter"
type="text"
placeholder="レアリティ"
oninput="renderCards()"
>

<button
class="add-btn"
onclick="addCard()"
>
カード追加
</button>

<button
class="json-btn"
onclick="exportJSON()"
>
JSON保存
</button>

<button
class="deck-btn"
onclick="analyzeDeck()"
>
不足抽出
</button>

<label>

<input
type="file"
hidden
onchange="importJSON(event)"
>

<button
type="button"
class="json-btn"
>
JSON読込
</button>

</label>

</div>

<div
id="cardList"
class="card-grid"
></div>

</div>

<script>

let cards = [];

function loadData(){

const saved =
localStorage.getItem(
"duema_cards"
);

if(saved){

cards =
JSON.parse(saved);

}else{

cards = [];

}

}

function saveData(){

localStorage.setItem(

"duema_cards",

JSON.stringify(cards)

);

}
function addCard(){

const name =
prompt("カード名");

if(!name) return;

const ruby =
prompt(
"カード名のルビ"
) || "";

const cost =
parseInt(
prompt("コスト")
) || 0;

const civilization =
prompt(
"文明（例: 火/水/自然）"
) || "";

const race =
prompt(
"種族"
) || "";

const rarity =
prompt(
"レアリティ(C/U/R/VR/SR/OR)"
) || "";

const target =
parseInt(
prompt(
"必要枚数"
)
) || 4;

cards.push({

id:Date.now(),

name:name,

ruby:ruby,

qty:0,

target:target,

cost:cost,

civilization:civilization,

race:race,

rarity:rarity

});

saveData();

renderCards();

}

function editCard(id){

const card =
cards.find(
c => c.id === id
);

if(!card) return;

const newName =
prompt(
"カード名",
card.name
);

if(!newName) return;

const newRuby =
prompt(
"ルビ",
card.ruby || ""
);

const newCost =
parseInt(
prompt(
"コスト",
card.cost || 0
)
) || 0;

const newCivilization =
prompt(
"文明",
card.civilization || ""
);

const newRace =
prompt(
"種族",
card.race || ""
);

const newRarity =
prompt(
"レアリティ",
card.rarity || ""
);

const newTarget =
parseInt(
prompt(
"必要枚数",
card.target || 4
)
) || 4;

card.name = newName;
card.ruby = newRuby;
card.cost = newCost;
card.civilization = newCivilization;
card.race = newRace;
card.rarity = newRarity;
card.target = newTarget;

saveData();

renderCards();

}

function deleteCard(id){

if(
!confirm(
"削除しますか？"
)
){
return;
}

cards =
cards.filter(
c => c.id !== id
);

saveData();

renderCards();

}

function changeQty(id, amount){

const card =
cards.find(
c => c.id === id
);

if(!card) return;

card.qty =
Math.max(
0,
(card.qty || 0)
+ amount
);

saveData();

renderCards();

}
function renderCards(){

const keyword =
document
.getElementById("searchBox")
.value
.toLowerCase();

const civ =
document
.getElementById("civilizationFilter")
.value;

const cost =
document
.getElementById("costFilter")
.value;

const race =
document
.getElementById("raceFilter")
.value
.toLowerCase();

const rarity =
document
.getElementById("rarityFilter")
.value
.toLowerCase();

const filtered =
cards.filter(card=>{

if(
!card.name
.toLowerCase()
.includes(keyword)
&&
!(
card.ruby || ""
)
.toLowerCase()
.includes(keyword)
){
return false;
}

if(
civ &&
!(
card.civilization || ""
)
.includes(civ)
){
return false;
}

if(
cost &&
(card.cost || 0)
> Number(cost)
){
return false;
}

if(
race &&
!(
card.race || ""
)
.toLowerCase()
.includes(race)
){
return false;
}

if(
rarity &&
!(
card.rarity || ""
)
.toLowerCase()
.includes(rarity)
){
return false;
}

return true;

});

document
.getElementById("cardList")
.innerHTML =
filtered.map(card=>`

<div class="card">

<h3>

<ruby>

${card.name}

<rt style="
font-size:10px;
color:#94a3b8;
">

${card.ruby || ""}

</rt>

</ruby>

</h3>

<div class="card-info">

<p>
文明：
${card.civilization || "-"}
</p>

<p>
コスト：
${card.cost || 0}
</p>

<p>
種族：
${card.race || "-"}
</p>

<p>
レアリティ：
${card.rarity || "-"}
</p>

<p>
所持枚数：
${card.qty || 0}
</p>

<p>
必要枚数：
${card.target || 4}
</p>

<p>
不足枚数：
${Math.max(
0,
(card.target || 4)
-
(card.qty || 0)
)}
</p>

</div>

<button
class="minus-btn"
onclick="changeQty(${card.id},-1)"
>
－
</button>

<button
class="plus-btn"
onclick="changeQty(${card.id},1)"
>
＋
</button>

<button
class="edit-btn"
onclick="editCard(${card.id})"
>
編集
</button>

<button
class="delete-btn"
onclick="deleteCard(${card.id})"
>
削除
</button>

</div>

`).
    function exportJSON(){

const json =
JSON.stringify(
cards,
null,
2
);

const blob =
new Blob(
[json],
{
type:"application/json"
}
);

const url =
URL.createObjectURL(blob);

const a =
document.createElement("a");

a.href = url;

a.download =
"duema_cards_backup.json";

a.click();

URL.revokeObjectURL(url);

}

function importJSON(event){

const file =
event.target.files[0];

if(!file) return;

const reader =
new FileReader();

reader.onload =
function(e){

try{

cards =
JSON.parse(
e.target.result
);

saveData();

renderCards();

alert(
"JSON読込完了"
);

}catch{

alert(
"JSON読込失敗"
);

}

};

reader.readAsText(file);

}

function analyzeDeck(){

const input =
prompt(
`デッキリストを貼り付け

例

4 フェアリー・ライフ
4 天災 デドダム
2 飛翔龍5000VT`
);

if(!input) return;

const lines =
input.split("\n");

let result = [];

lines.forEach(line=>{

line = line.trim();

if(!line) return;

const match =
line.match(
/^(\\d+)\\s+(.+)$/
);

if(!match) return;

const need =
parseInt(
match[1]
);

const name =
match[2].trim();

const ownedCard =
cards.find(
c =>
c.name.toLowerCase()
===
name.toLowerCase()
);

const owned =
ownedCard
? ownedCard.qty
: 0;

const shortage =
Math.max(
0,
need - owned
);

if(shortage > 0){

result.push(

`${name}

必要:${need}
所持:${owned}
不足:${shortage}`

);

}

});

if(result.length === 0){

alert(
"不足カードはありません"
);

return;

}

alert(
result.join(
"\n\n"
)
);

}

loadData();

renderCards();

</script>

</body>

</html>
