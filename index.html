<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デュエマ所持カード管理</title>

<style>
body{
    font-family:sans-serif;
    background:#0f172a;
    color:white;
    margin:0;
    padding:20px;
}

.container{
    max-width:1000px;
    margin:auto;
}

.card{
    background:#1e293b;
    padding:15px;
    border-radius:10px;
    margin-bottom:10px;
}

button{
    cursor:pointer;
    border:none;
    border-radius:6px;
    padding:8px 12px;
}

.add{
    background:#4f46e5;
    color:white;
}

.plus{
    background:#16a34a;
    color:white;
}

.minus{
    background:#dc2626;
    color:white;
}

input{
    padding:8px;
    border-radius:6px;
}

#cardList{
    margin-top:20px;
}
</style>

</head>
<body>

<div class="container">

<h1>デュエマ所持カード管理</h1>

<input
id="searchBox"
type="text"
placeholder="カード名検索"
oninput="renderCards()"
>

<button
class="add"
onclick="addCard()"
>
カード追加
</button>

<div id="cardList"></div>

</div>

<script>

let cards=[];

function loadData(){

const saved=
localStorage.getItem("duema_cards");

if(saved){

cards=JSON.parse(saved);

}else{

cards=[
{
id:1,
name:"フェアリー・ライフ",
qty:0
},
{
id:2,
name:"天災 デドダム",
qty:0
},
{
id:3,
name:"飛翔龍5000VT",
qty:0
}
];

}

}

function saveData(){

localStorage.setItem(
"duema_cards",
JSON.stringify(cards)
);

}

function addCard(){

const name=
prompt("カード名");

if(!name)return;

cards.push({
id:Date.now(),
name:name,
qty:0
});

saveData();
renderCards();

}

function changeQty(id,amount){

const card=
cards.find(
c=>c.id===id
);

if(!card)return;

card.qty=
Math.max(
0,
card.qty+amount
);

saveData();
renderCards();

}

function deleteCard(id){

if(
!confirm("削除しますか？")
)return;

cards=
cards.filter(
c=>c.id!==id
);

saveData();
renderCards();

}

function renderCards(){

const keyword=
document
.getElementById("searchBox")
.value
.toLowerCase();

const list=
document
.getElementById("cardList");

const filtered=
cards.filter(
card=>
card.name
.toLowerCase()
.includes(keyword)
);

list.innerHTML=
filtered.map(card=>`

<div class="card">

<h3>${card.name}</h3>

<p>所持枚数: ${card.qty}</p>

<button
class="minus"
onclick="changeQty(${card.id},-1)"
>
－
</button>

<button
class="plus"
onclick="changeQty(${card.id},1)"
>
＋
</button>

<button
onclick="deleteCard(${card.id})"
>
削除
</button>

</div>

`).join("");

}

loadData();
renderCards();

</script>

</body>
</html>
